<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Job application</h1>
    
    <form>

        <label for="name">Name:</label>
        <input type="text" id="name " name="name">
        <br>
        <br>

        <label for="email">Email ID:</label>
        <input type="email" id="emailid " name="emailid">
        <br>
        <br>

        <label for="phoneNumber ">Phone No:</label>
        <input type="tel" id="phoneNumber" name="phoneNumber">
        <br>
        <br>

        <label for="fileUpload">Resume:</label>
        <input type="file" name="fileUpload" id="fileUpload">
        <br>
        <br>

        <label for="counter">Experiance(in yrs)</label>

        <input type="number" name="counter" id="counter" min="0" max="50">
        <br>
        <br>

        <fieldset>
            <legend>Skills:</legend>

            <label for="checkbox">HTML</label>
            <input type="checkbox" name="checkbox" id="checkbox">

            <label for="checkbox2">CSS</label>
            <input type="checkbox" name="checkbox2" id="checkbox2">


            <label for="checkbox3">JavaScript</label>
            <input type="checkbox" name="checkbox3" id="checkbox3">

        </fieldset>
        <br>
        <br>


        <label for="educationType">Highest Education</label>
        <select name="educationType" id="educationType">
            <option value="">School</option>
            <option value="b">College</option>
            <option value="c">University</option>

        </select>

        <fieldset>
            <legend>Availability:</legend>

            <label for="radio1">Full Time</label>
            <input type="radio" name="radio" id="radio1">
            <br>

            <label for="radio2">Full Time</label>
            <input type="radio" name="radio" id="radio2">


        </fieldset>
        <br>
        <br>

        <input type="Submit">



    </form>
</body>
</html>
