<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>University Registration form</h1>
    <p>Please fill out the form to register. </p>
    <hr>

    <form>

        <h2>Personal details</h2>

        <label for="name">First Name:</label>
        <input type="text" name="name" id="name" placeholder="eg: Md">
        <br><br>
        
        <label for="surname">Last Name:</label>
        <input type="text" name="surname" id="surname" placeholder="eg: izarail">
        <br><br>

        <label for="dob">DOB:</label>
        <input type="date" name="dob" id="dob">
        <br> <br>

        <h3>Gender:</h3>

        <label for="male">Male</label>
        <input type="radio" name="gender" id="male">
        <br>

        <label for="female">Female</label>
        <input type="radio" name="gender" id="female">
        <br>

        <label for="other">Other</label>
        <input type="radio" name="gender" id="other">
        <br><br>

        <h3>Upload Your Photo</h3>
        <input type="file" name="file">

        <hr>

        <h2>Contract Information</h2>
        
        <label for="email">Email Address:</label>
        <input type="email" name="email" id="email">

        <br><br>

        <label for="phone">Phone</label>
        <input type="tel" name="phone " id="phone">
        <br><br>
        
        <label for="Address">Mailing Address:</label>
        <br>
        <textarea name="Address" id="Address" rows="10" cols="30"></textarea>

        <hr>

        <h2>Academic information</h2>

        <label for="course">Select Your Course</label>
        <select name="course" id="course">
            <option value="cse">CSE</option>
            <option value="me">ME</option>
            <option value="ce">CE</option>
        </select>

        <br>

        <h3>Extracurricular activity</h3>

        <label for="sports">Sports</label>
        <input type="checkbox" name="intrest" id="sports" value="sports">
        <br> <br>

        <label for="music">Music</label>
        <input type="checkbox" name="intrest" id="music" value="music">
        <br> <br>

        <label for="technology">Technology</label>
        <input type="checkbox" name="value" id="technology" value="technology">
        <br> <br>

        <hr>

        <h2>Create Your account</h2>

        <label for="pass">Create Password</label>
        <input type="password" name="password" id="pass">
        <br><br>

        <label for="security">Security Question:</label>
        <input type="text" name="security" id="security" placeholder="what is your first pet name?">
        <br><br>

        <label for="answer">Security Answer:</label>
        <input type="text" name="answer" id="answer">
        <br><br>

        <label for="agree">I agree to the Terms and Conditions.</label>
        <input type="checkbox" name="agree" id="agree">

        <hr>

        <button type="submit">Register</button>
        <button type="reset">Clear form</button>

    </form>
</body>
</html>
