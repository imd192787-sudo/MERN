<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>University Registration form </h1>
    <p>Please fill out the form to register.</p>
    <hr>
    <br><br>

    <h1>Personal details</h1>
    <br>

    <label for="name">First Name:</label>
    <input type="name" name="name" id="name" placeholder="eg:Md">
    <br> <br>


    <label for="surName">Last Name:</label>
    <input  type="surName" id="surName" name="surName" placeholder="eg:izarail">
    <br><br>

    <label for="dob">DOB:</label>
    <input type="date" name="dob", id="dob">
    <br><br>


    <h3>Gender:</h3>
    <label for="male">male:</label>
    <input type="radio" name="male" id="male">

    <label for="female">Female:</label>
    <input type="radio" name="female" id="female">

    <label for="other">Other:</label>
    <input type="radio" name="other" id="other">
    <br><br>

    <h3>Upload your photo:</h3>
    <input type="image" name="image" id="image">
    <br> <br>
    <hr>

    <h2>Contract Information</h2>

    <label for="email">Email Address</label>
    <input type="email" name="email" id="email">
    <br> <br>

    <label for="phone">Phone:</label>
    <input type="tel" name="phone" id="name">
    <br><br>

    <label for="mailing">Mailing Address:</label>
    <textarea name="Mailing" id="Mailing"></textarea>

</body>
</html>
